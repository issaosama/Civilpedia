<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Studio Lite — Civilpedia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div>
      <h1>Content Studio Lite</h1>
      <div class="subtitle">Civilpedia — محرر محتوى الموسوعة</div>
    </div>
  </header>

  <nav class="sticky-toolbar" id="sticky-toolbar">
    <div class="sticky-toolbar-inner">
      <button class="btn btn-primary btn-tb" id="load-btn">📂 Load Draft JSON</button>
      <input type="file" id="file-input" accept=".json">
      <span id="file-name" class="tb-file-name"></span>

      <div class="tb-sep"></div>

      <button class="btn btn-success btn-tb" id="download-btn" disabled>💾 Download Draft JSON</button>

      <div class="tb-sep"></div>

      <button class="btn btn-outline btn-tb" id="undo-btn" disabled>↶ Undo</button>

      <div class="tb-sep"></div>

      <button class="btn btn-outline btn-tb" id="validate-btn">✔ Validate Draft</button>
      <button class="btn btn-outline btn-tb" id="preview-btn">🔄 Refresh Preview</button>

      <div class="tb-sep"></div>

      <button class="btn btn-primary btn-tb" id="export-btn" disabled>📦 Export App-ready JSON</button>
    </div>
  </nav>

  <div class="app-layout">

    <!-- LEFT: Editor Panel -->
    <div class="editor-panel">
      <div class="panel-header">
        <span>✏️ المحرر</span>
      </div>
      <div class="panel-body" id="topic-metadata">
        <!-- Metadata form rendered here by app.js -->
      </div>

      <div class="panel-body panel-body-sections">
        <h3 class="sections-heading">الأقسام والكتل</h3>
        <div id="sections-container">
          <div class="empty-state">قم بتحميل ملف Draft JSON لعرض الأقسام والكتل</div>
        </div>
      </div>

      <div id="export-warning"></div>
    </div>

    <!-- RIGHT: Preview Panel -->
    <div class="preview-panel">
      <div class="panel-header">
        <span>👁️ المعاينة</span>
        <button class="btn btn-outline btn-sm" id="preview-theme-toggle">🌙 داكن</button>
      </div>
      <div class="panel-body" id="preview-container">
        <div class="preview-empty">قم بتحميل ملف Draft لعرض المعاينة</div>
      </div>
      <div class="panel-body panel-body-sections" id="validation-results"></div>
    </div>

  </div>

  <script src="js/schema.js"></script>
  <script src="js/draft.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
