# Civilpedia V1-R09Q-A — deterministic Flutter quality gate CI.
#
# Frozen authority: V1-R09Q-CONTRACT-v1 + ARCHITECT ADDENDUM A. The suite list
# lives ONLY in tool/quality_gate.ps1 (single source of truth); this workflow
# sets up the pinned toolchain and invokes that gate. No suite list is
# duplicated here.
#
# Triggers: pull_request, push to main, workflow_dispatch. No schedule/nightly
# job exists in R09Q.
name: flutter-quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gate:
    name: selected-cross-cutting-suites
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.32.8 stable / Dart 3.8.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
          cache: true

      - name: Resolve dependencies in fresh checkout
        run: flutter pub get

      - name: Run deterministic quality gate
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tool/quality_gate.ps1